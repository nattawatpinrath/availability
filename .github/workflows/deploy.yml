name: Sync calendar and deploy

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may run it a few minutes late)
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r scripts/requirements.txt

      - name: Read calendar (busy times only)
        env:
          ICS_URLS: ${{ secrets.ICS_URLS }}
          OUT: build/busy.json        # stays inside the runner, never published as is
          DAYS_AHEAD: "60"
        run: python scripts/fetch_busy.py

      - name: Encrypt for each active temporary link
        env:
          LINK_SECRET: ${{ secrets.LINK_SECRET }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python scripts/publish_links.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
