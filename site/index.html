<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Availability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<!-- bump ?v= after editing so visitors don't get a cached old copy -->
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="ownerName"></h1>
      <p id="tzLabel"></p>
      <p class="muted updated" id="updated"></p>
    </div>
    <div class="refresh">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="th">TH</button>
      </div>
      <button type="button" class="btn" id="refresh" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <span class="lbl" data-t="refresh"></span>
      </button>
      <a class="btn admin" id="adminBtn" href="admin.html" aria-label="Admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span class="lbl">Admin</span>
      </a>
    </div>
  </header>

  <!-- shown when there is no valid link -->
  <section class="card locked" id="locked" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
    <h2 id="lockedTitle"></h2>
    <p id="lockedText"></p>
  </section>

  <div id="app" hidden>
    <section class="card">
      <div class="weeknav">
        <button type="button" class="btn" id="today" data-t="today"></button>
        <button type="button" class="navbtn" id="prevWeek" aria-label="Previous week">‹</button>
        <div class="weekpick">
          <button type="button" class="weekbtn" id="weekBtn" aria-haspopup="dialog" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
            <span id="weekText"></span><span class="h" id="weekHours"></span>
          </button>
          <div class="picker" id="picker" role="dialog" hidden>
            <div class="p-head">
              <button type="button" class="navbtn" id="pPrev" aria-label="Previous month">‹</button>
              <b id="pMonth"></b>
              <button type="button" class="navbtn" id="pNext" aria-label="Next month">›</button>
            </div>
            <div class="p-dow" id="pDow"></div>
            <div id="pGrid"></div>
            <div class="p-legend"><span><i style="background:var(--free-ink)"></i><span data-t="hasFree"></span></span><span><i style="background:var(--busy-ink)"></i><span data-t="fullyBooked"></span></span></div>
          </div>
        </div>
        <button type="button" class="navbtn" id="nextWeek" aria-label="Next week">›</button>
        <button type="button" class="iconbtn" id="copyWeek">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
        </button>
      </div>
    </section>

    <section class="card">
      <div class="next">
        <span class="k" data-t="nextAvailable"></span>
        <span class="v" id="nextFree">–</span>
        <span class="t" id="weekTotal"></span>
      </div>
      <ul class="days" id="summary"></ul>
    </section>

    <section class="card">
      <div class="cal" id="cal" role="grid"></div>
      <div class="legend">
        <span><i class="lg-free"></i><span data-t="legendFree"></span></span>
        <span><i class="lg-busy"></i><span data-t="busy"></span></span>
        <span><i class="lg-off"></i><span data-t="legendOff"></span></span>
      </div>
      <p class="notice"><span id="validity"></span></p>
      <p class="muted foot" data-t="foot"></p>
    </section>
  </div>
</main>

<div class="actionbar" id="actionbar" hidden>
  <div class="what"><span id="selText"></span><small data-t="bkk"></small></div>
  <a id="requestBtn" data-t="request"></a>
  <button type="button" id="selClose" aria-label="Close">×</button>
</div>
<div class="toast" id="toast" hidden></div>

<script src="config.js?v=17"></script>
<script src="app.js?v=17"></script>
</body>
</html>
